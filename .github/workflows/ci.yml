# CI/CD do Jhon Fit
#  - Em todo push e pull request: lint, checagens de estrutura e testes de navegador (inclui acessibilidade).
#  - Só na branch main, e só se tudo passar: publica a pasta app/ no GitHub Pages.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Se chegar um push novo enquanto o anterior ainda roda, o antigo é cancelado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checagens de estrutura
        run: npm run check
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador
        run: npm test
      - name: Guardar relatório se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Publicar
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Carimbar a versão
        # O service worker compara este arquivo para saber que existe versão nova.
        run: |
          VERSION="$(node -p "require('./package.json').version")+${GITHUB_SHA::7}"
          echo "self.JF_VERSION = '${VERSION}';" > app/version.js
          echo "Versão publicada: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
